name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {} # no secrets needed — pure unit + integration tests

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test
