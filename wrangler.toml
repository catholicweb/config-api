# https://developers.cloudflare.com/workers/wrangler/configuration/
name = "parroquia-config-api"
main = "src/index.js"
compatibility_date = "2026-07-14"
workers_dev = false

# Public endpoint: https://api.parroquia.app — the custom domain is bound to
# this Worker in the Cloudflare dashboard. This API token lacks Zone ->
# Workers Routes / DNS edit permission, so the route is managed there, not here.
# (Putting it in `routes` below makes `wrangler deploy` fail with auth error 10000.)

# Single R2 bucket. Everything lives here:
#   npx wrangler r2 bucket create parroquia
#
#   auth.enc                  — ALL credential state in ONE AES-GCM-256 blob
#                               {emails, tokens, magic} encrypted under AUTH_KEY
#   <slug>/<token>            — a file (token = flat URL-safe filename; clients encode
#                               local paths by replacing / with -; see README.md)
# Exposed in the Worker as env.CONTENT.
#
# Secrets required for site creation (POST /sites/:slug) — set with wrangler secret put:
#
#   npx wrangler secret put ADMIN_TOKEN_HASH        # sha256 hex of your admin token
#   npx wrangler secret put CLOUDFLARE_API_TOKEN    # API token with Zone.DNS:Edit + Account.Pages:Edit
#   npx wrangler secret put CLOUDFLARE_ACCOUNT_ID   # Cloudflare account ID
#   npx wrangler secret put CLOUDFLARE_ZONE_ID      # Zone ID for parroquia.app
#
# Secrets required for magic-link email delivery:
#
#   npx wrangler secret put RESEND_API_KEY          # API key for the email provider
#   npx wrangler secret put FROM_EMAIL              # verified sender address (default no-reply@parroquia.app)
#
# Secret required to encrypt/decrypt the credential store (auth.enc):
#
#   npx wrangler secret put AUTH_KEY                # base64 of 32 random bytes -> AES-256-GCM key
#                                                   #   generate: openssl rand -base64 32
#                                                   # BACK THIS UP — the bucket is public and auth.enc is
#                                                   # the only copy of every editor token/grant. A missing
#                                                   # or invalid key means every write returns 503 and the
#                                                   # store never encrypts. (EMAIL_HASH_SECRET was removed;
#                                                   # emails now live recoverably inside the encrypted blob.
#                                                   # No migration: auth.enc is created lazily on first write.)
#
# Optional secret for auto-build (dispatches web-template's deploy workflow when a
# site's config.json is written). If unset, the feature is off and saves still work:
#
#   npx wrangler secret put GITHUB_BUILD_TOKEN      # fine-grained PAT, Actions: read and write
#                                                   # on catholicweb/web-template ONLY (least privilege).
#                                                   # A classic PAT with broad repo scope is NOT recommended.
#
# Secrets required for FCM (subscribe + send):
#
#   npx wrangler secret put FCM_SERVER_KEY          # Firebase Cloud Messaging server key
#                                                   # (from Firebase Console → Project Settings → Cloud Messaging).
#                                                   # Used by POST /api/fcm/token to subscribe browser
#                                                   # registration tokens to per-site FCM topics, AND by the
#                                                   # daily cron (src/notifications.js) to send topic
#                                                   # messages for tomorrow's calendar events.
#
# For local dev, put them in .dev.vars instead (gitignored).

# Non-secret: where the emailed magic link points (the editor magic-link landing
# page). Defaults to https://editor.parroquia.app/magic when unset.
[vars]
MAGIC_LINK_BASE = "https://editor.parroquia.app/magic"

# Public origin that serves file bytes at /:slug/:token (no auth). The worker
# builds every media/list absolute URL from this. Defaults to
# https://data.parroquia.app when unset, mirroring MAGIC_LINK_BASE.
DATA_BASE = "https://data.parroquia.app"

[[r2_buckets]]
binding = "CONTENT"
bucket_name = "parroquia"


[observability.logs]
enabled = true
invocation_logs = true

# Daily cron: send FCM topic notifications for tomorrow's calendar events.
# Runs at 19:00 UTC (= 20:00 CET winter / 21:00 CEST summer). At this hour
# "tomorrow" is the same date in both UTC and Europe/Madrid, avoiding
# timezone-boundary edge cases in the date comparison.
[[triggers]]
crons = ["0 19 * * *"]
